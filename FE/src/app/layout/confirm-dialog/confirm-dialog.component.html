@if (dialog(); as d) {
  <div class="dialog-backdrop" (click)="onBackdropClick($event)" role="presentation">
    <div class="dialog-modal dialog-{{ d.type }}" role="dialog" aria-modal="true">
      <div class="dialog-header">
        <div class="dialog-icon-wrap">
          @switch (d.type) {
            @case ('danger') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            }
            @case ('warning') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
            }
            @case ('success') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            }
            @default {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
            }
          }
        </div>
        <div class="dialog-title-wrap">
          <h3 class="dialog-title">{{ d.title }}</h3>
        </div>
      </div>

      <div class="dialog-body">
        <p class="dialog-message">{{ d.message }}</p>
        @if (d.detailMessage) {
          <div class="dialog-detail-callout">
            <span class="callout-icon">⚠️</span>
            <span class="callout-text">{{ d.detailMessage }}</span>
          </div>
        }
      </div>

      <div class="dialog-footer">
        @if (d.showCancel) {
          <button type="button" class="btn-cancel" (click)="dialogService.handleCancel()">
            {{ d.cancelText }}
          </button>
        }
        <button
          type="button"
          class="btn-confirm btn-{{ d.type }}"
          (click)="dialogService.handleConfirm()"
          autofocus
        >
          {{ d.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
