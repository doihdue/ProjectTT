spring.application.name=BE
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=qlsv;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

jwt.secret=change-this-secret-to-a-long-random-string
jwt.expiration-ms=86400000

# RabbitMQ Configuration (Tự động thích ứng nếu chưa cài RabbitMQ qua Docker)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=500ms
spring.rabbitmq.template.retry.enabled=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.auto-startup=${app.rabbitmq.enabled:false}
app.rabbitmq.enabled=true

